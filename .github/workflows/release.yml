name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # If there are pending changesets, this opens/updates a standing
      # "Version Packages" PR that bumps @nyckai/aqueous-ui's version and
      # writes packages/ui/CHANGELOG.md from the accumulated changesets.
      # Merging that PR re-triggers this workflow; at that point there are
      # no pending changesets left, so this step instead runs the `publish`
      # command below, which pushes to GitHub Packages
      # (https://npm.pkg.github.com — see root .npmrc and
      # packages/ui/package.json's publishConfig).
      #
      # GitHub Packages publishes with the workflow's own built-in
      # GITHUB_TOKEN (via the `packages: write` permission above) — no
      # separate registry secret needs provisioning.
      #
      # REQUIRES this repo to actually live under a GitHub org/account
      # named "nyck" — GitHub Packages requires the npm scope (@nyck) to
      # exactly match the repo's owner. Until the repo moves there, this
      # publish step will fail with a 404/403, which is expected.
      - name: Create Release PR or Publish
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
